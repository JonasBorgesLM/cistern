# Dependabot reads one go.mod per `directory` entry, and this repository has
# more than one. A missing entry means that module is never checked -- a
# silent gap rather than a visible failure.
version: 2

updates:
  # The core admits no dependencies (ADR-0001). This entry is a tripwire: if
  # Dependabot ever opens a pull request here, something was added that should
  # not have been. ci.yml's dependency-policy job fails on the same condition.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, core]
    commit-message:
      prefix: "build(deps)"

  # The Redis store: go-redis, plus testcontainers for the integration suite
  # (from C4 onward).
  - package-ecosystem: gomod
    directory: /redisstore
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, store]
    commit-message:
      prefix: "build(deps)"
    groups:
      test-tooling:
        patterns:
          - "github.com/testcontainers/*"
          - "github.com/docker/*"

  # Actions are pinned by major version; an action update is a supply-chain
  # change that deserves the same review as a code dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
